<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>엄청난 주식으로 부자되기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-title">
      <h1>엄청난 주식으로 부자되기</h1>
      <span class="day-chip" id="dayLabel">Day 1</span>
    </div>

    <div class="stats-row">
      <div class="stat-pill">
        <span class="stat-label">현금</span>
        <strong class="stat-value" id="statCash">100,000원</strong>
      </div>
      <div class="stat-pill">
        <span class="stat-label">총자산</span>
        <strong class="stat-value" id="statTotal">100,000원</strong>
      </div>
      <div class="stat-pill">
        <span class="stat-label">수익률</span>
        <strong class="stat-value" id="statReturn">+0.00%</strong>
      </div>
      <button class="news-btn" id="newsBtn">📰 오늘의 뉴스 보기</button>
    </div>
  </header>

  <main class="market-grid" id="marketGrid"></main>

</div>

<footer class="footer-bar">
  <button class="reset-btn" id="resetBtn">게임 초기화</button>
</footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <button class="modal-close" id="modalClose">✕</button>
    <p class="modal-day" id="modalDay">Day 1</p>
    <p class="modal-subtitle">오늘의 시장 소식</p>
    <div id="modalNews"></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="script.js" defer></script>
</body>
</html>
