<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>엄청난 주식으로 부자되기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

:root{
  --bg:#0a0e1a;
  --bg-radial: radial-gradient(circle at 50% -10%, #1a2340 0%, #0a0e1a 55%);
  --panel:#121a2c;
  --panel-2:#182238;
  --line: rgba(201,162,39,.28);
  --line-strong: rgba(201,162,39,.55);
  --gold:#c9a227;
  --gold-bright:#e8c766;
  --text:#eae7dd;
  --text-dim:#8891a5;
  --up:#e5484d;
  --down:#4a90e2;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-radial);
  color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  min-height:100vh;
  padding:32px 20px 80px;
}
.wrap{max-width:920px;margin:0 auto;}

/* Header */
.header{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding-bottom:18px;border-bottom:1px solid var(--line-strong);
  flex-wrap:wrap;gap:12px;
}
.header h1{
  font-family:'Noto Serif KR',serif;
  font-weight:900;font-size:28px;letter-spacing:.02em;
  margin:0;color:var(--gold-bright);
  text-shadow:0 0 24px rgba(201,162,39,.25);
}
.header .sub{margin:4px 0 0;font-size:12.5px;color:var(--text-dim);letter-spacing:.03em;}
.day-info{text-align:right;}
.day-label{
  font-family:'Noto Serif KR',serif;font-weight:700;font-size:20px;
  margin:0;color:var(--text);
}
.day-timer{margin:2px 0 0;font-size:12.5px;color:var(--gold);font-variant-numeric:tabular-nums;}

/* Stats */
.stats{
  display:grid;grid-template-columns:repeat(3,1fr) auto;gap:0;
  margin-top:22px;border:1px solid var(--line);background:var(--panel);
}
.stat{padding:16px 20px;border-right:1px solid var(--line);}
.stat:last-of-type{border-right:1px solid var(--line);}
.stat-label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:6px;letter-spacing:.03em;}
.stat-value{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;}
.stat-value.pos{color:var(--up);}
.stat-value.neg{color:var(--down);}
.reset-wrap{display:flex;align-items:center;justify-content:center;padding:0 18px;}
.reset-btn{
  background:transparent;border:1px solid var(--line-strong);color:var(--text-dim);
  padding:9px 16px;font-size:12.5px;cursor:pointer;font-family:inherit;
  transition:.15s;white-space:nowrap;
}
.reset-btn:hover{border-color:var(--up);color:var(--up);}

/* Market table */
.market{margin-top:26px;border:1px solid var(--line);}
.market-head, .row{
  display:grid;
  grid-template-columns: 1.7fr 1fr .9fr .7fr 1.5fr;
  align-items:center;
}
.market-head{
  padding:12px 18px;font-size:11.5px;color:var(--text-dim);
  border-bottom:1px solid var(--line-strong);background:var(--panel);
  letter-spacing:.03em;
}
.market-body{background:var(--panel-2);}
.row{
  padding:14px 18px;border-bottom:1px solid var(--line);
  font-size:14px;
}
.row:last-child{border-bottom:none;}
.co-name{font-weight:700;color:var(--text);}
.co-price{font-variant-numeric:tabular-nums;}
.co-change{font-variant-numeric:tabular-nums;font-weight:700;}
.co-change.up{color:var(--up);}
.co-change.down{color:var(--down);}
.co-hold{font-variant-numeric:tabular-nums;color:var(--text-dim);}
.trade{display:flex;gap:6px;align-items:center;}
.trade input{
  width:52px;background:var(--bg);border:1px solid var(--line);color:var(--text);
  padding:6px 4px;font-size:13px;text-align:center;font-family:inherit;
}
.trade input:focus{outline:none;border-color:var(--gold);}
.trade button{
  border:1px solid var(--line-strong);background:transparent;padding:6px 10px;
  font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--text);transition:.15s;
}
.btn-buy:hover{background:var(--up);border-color:var(--up);color:#0a0e1a;}
.btn-sell:hover{background:var(--down);border-color:var(--down);color:#0a0e1a;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(5,7,14,.86);
  display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
}
.modal-overlay.show{display:flex;}
.modal-card{
  position:relative;max-width:480px;width:100%;
  background:var(--panel);border:1px solid var(--gold);
  box-shadow:0 0 60px rgba(201,162,39,.18);
  padding:36px 30px 30px;
}
.modal-close{
  position:absolute;top:14px;right:16px;background:none;border:none;
  color:var(--text-dim);font-size:18px;cursor:pointer;line-height:1;
}
.modal-close:hover{color:var(--gold-bright);}
.modal-day{
  font-family:'Noto Serif KR',serif;font-weight:900;font-size:40px;
  margin:0;color:var(--gold-bright);text-align:center;
}
.modal-subtitle{
  text-align:center;color:var(--text-dim);font-size:12.5px;margin:6px 0 26px;
  letter-spacing:.03em;
}
.news-item{
  display:flex;gap:10px;padding:13px 0;border-top:1px solid var(--line);
}
.news-item:first-child{border-top:none;}
.news-arrow{font-size:15px;flex-shrink:0;margin-top:1px;}
.news-arrow.up{color:var(--up);}
.news-arrow.down{color:var(--down);}
.news-co{font-weight:700;font-size:13.5px;margin:0 0 3px;}
.news-headline{font-size:13px;color:var(--text-dim);margin:0;line-height:1.5;}

@media(max-width:640px){
  .stats{grid-template-columns:1fr 1fr;}
  .stat:nth-child(3){border-right:none;}
  .reset-wrap{grid-column:1/-1;padding:14px 18px;justify-content:flex-start;border-top:1px solid var(--line);}
  .market-head{display:none;}
  .row{grid-template-columns:1fr;gap:6px;padding:16px 18px;}
  .trade{margin-top:8px;}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div>
      <h1>엄청난 주식으로 부자되기</h1>
      <p class="sub">PREMIUM TRADING DESK</p>
    </div>
    <div class="day-info">
      <p class="day-label" id="dayLabel">Day 1</p>
      <p class="day-timer" id="dayTimer">03:00</p>
    </div>
  </header>

  <section class="stats">
    <div class="stat">
      <span class="stat-label">보유 현금</span>
      <span class="stat-value" id="statCash">100,000원</span>
    </div>
    <div class="stat">
      <span class="stat-label">총자산</span>
      <span class="stat-value" id="statTotal">100,000원</span>
    </div>
    <div class="stat">
      <span class="stat-label">수익률</span>
      <span class="stat-value" id="statReturn">+0.00%</span>
    </div>
    <div class="reset-wrap">
      <button class="reset-btn" id="resetBtn">게임 초기화</button>
    </div>
  </section>

  <section class="market">
    <div class="market-head">
      <span>회사</span><span>현재가</span><span>등락률</span><span>보유량</span><span>거래</span>
    </div>
    <div class="market-body" id="marketBody"></div>
  </section>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <button class="modal-close" id="modalClose">✕</button>
    <p class="modal-day" id="modalDay">Day 1</p>
    <p class="modal-subtitle">오늘의 시장 소식</p>
    <div id="modalNews"></div>
  </div>
</div>

<script>
const COMPANIES=[
{id:'ai',name:'배정호 AI 테크',base:15000,up:['새로운 휴머노이드 AI 개발 성공','새로운 AI 모델 출시'],down:['AI 코드에 심각한 오류 발생','배정호 AI 테크 보안 사고 발생']},
{id:'bike',name:'강동하 픽시 바이크',base:8000,up:['강동하 픽시 바이크 SNS로 큰 유행','강동하 픽시 바이크 신제품 출시'],down:['픽시 작물 유행으로 강동하 픽시 바이크 명예 추락','강동하 픽시 바이크 신제품 치명적 결함 발생']},
{id:'spar',name:'조승우 스파링 아카데미',base:6000,up:['치안이 안 좋아지며 호신술 학원 떠올라','조승우 스파링 아카데미 원장 조승우 UFC 세계 재패'],down:['학교에서 스파링을 하는 일명 야차룰 유행... 학교폭력 우려','조승우 스파링 아카데미 시설 재검토 필요']},
{id:'model',name:'허진욱 프라모델',base:4000,up:['허진욱 프라모델 새로운 프라모델 출시','최근 십대들 SNS에서 프라모델 만들기 유행'],down:['허진욱 프라모델 제조과정에서 유해 물질 발견... 전량 회수','허진욱 프라모델 제품 또다시 가격 인상... 지갑 사정이 남아나지 않아']},
{id:'motors',name:'전민기 모터스',base:20000,up:['전민기 모터스 차로 레이싱 대회 5연속 우승!','전민기 모터스 신차 출시!'],down:['전민기 모터스 부품중 중국산 부품 나와..','전민기 모터스 전기차 안전 위험 요소 검토하지 않아 논란']},
{id:'sports',name:'곽청명 스포츠 용품',base:9000,up:['손흥민 가장 애용하는 브랜드 곽청명 스포츠라고 밝혀!!','곽청명 스포츠 신제품 신축성, 기존 시장에는 없던 기술'],down:['곽청명 스포츠 모델 학폭 논란','최근 중국산 스포츠 용품 리뷰 챌린지 유행']},
{id:'game',name:'박규현 게임 랩',base:11000,up:['10대부터 60대까지 게임 열풍!!','박규현 게임 랩 새로운 게임 장르 구축'],down:['학생들의 게임 중독 날이 갈수록 심해져','박규현 게임 랩 새로운 게임 출시 지연....']}
];

const DAY_LENGTH=180000;
const TICK_LENGTH=10000;
const INIT_CASH=100000;
const KEY='richStockGame_v1';

const $=id=>document.getElementById(id);
const randRange=(a,b)=>Math.random()*(b-a)+a;
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const fmtWon=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const fmtPct=p=>(p>=0?'+':'')+p.toFixed(2)+'%';
const pad2=n=>String(n).padStart(2,'0');

function generateNews(){
  const shuffled=[...COMPANIES].sort(()=>Math.random()-0.5).slice(0,3);
  return shuffled.map(c=>{
    const dir=Math.random()<0.5?'up':'down';
    return {companyId:c.id,direction:dir,headline:pick(c[dir])};
  });
}

function newGameState(){
  const prices={};
  COMPANIES.forEach(c=>prices[c.id]=c.base);
  const now=Date.now();
  return{
    cash:INIT_CASH,day:1,holdings:{},prices,
    dayOpenPrices:{...prices},
    dayStartTs:now,lastTickTs:now,
    todayNews:generateNews(),pendingModal:true
  };
}

function load(){
  const raw=localStorage.getItem(KEY);
  if(!raw) return newGameState();
  let s;
  try{ s=JSON.parse(raw); }catch(e){ return newGameState(); }
  if(!s || !s.prices) return newGameState();
  const elapsed=Date.now()-s.dayStartTs;
  if(!s.pendingModal && elapsed>=DAY_LENGTH){
    s.day+=1;
    s.todayNews=generateNews();
    s.dayOpenPrices={...s.prices};
    s.pendingModal=true;
    s.dayStartTs=Date.now();
    s.lastTickTs=Date.now();
  }
  return s;
}

let state=load();
function save(){ localStorage.setItem(KEY,JSON.stringify(state)); }

function tick(){
  const newsMap={};
  state.todayNews.forEach(n=>newsMap[n.companyId]=n.direction);
  COMPANIES.forEach(c=>{
    let p=state.prices[c.id];
    if(newsMap[c.id]==='up') p*=1+randRange(0.08,0.18);
    else if(newsMap[c.id]==='down') p*=1-randRange(0.08,0.18);
    else p*=1+randRange(-0.025,0.025);
    state.prices[c.id]=Math.max(100,Math.round(p));
  });
}

function checkDayChange(){
  const now=Date.now();
  if(now-state.dayStartTs>=DAY_LENGTH){
    state.day+=1;
    state.todayNews=generateNews();
    state.dayOpenPrices={...state.prices};
    state.pendingModal=true;
    openModal();
  }
}

function buy(id){
  const input=$('qty-'+id);
  const qty=parseInt(input.value,10);
  if(!qty||qty<=0) return;
  const cost=state.prices[id]*qty;
  if(state.cash<cost){ alert('현금이 부족합니다.'); return; }
  state.cash-=cost;
  state.holdings[id]=(state.holdings[id]||0)+qty;
  save(); renderDynamic();
}

function sell(id){
  const input=$('qty-'+id);
  const qty=parseInt(input.value,10);
  if(!qty||qty<=0) return;
  const have=state.holdings[id]||0;
  if(have<qty){ alert('보유 수량이 부족합니다.'); return; }
  state.holdings[id]=have-qty;
  state.cash+=state.prices[id]*qty;
  save(); renderDynamic();
}

function resetGame(){
  if(!confirm('정말 게임을 초기화하시겠습니까? 모든 진행 상황이 사라집니다.')) return;
  state=newGameState();
  save();
  buildMarket();
  renderDynamic();
  openModal();
}

function openModal(){
  $('modalDay').textContent='Day '+state.day;
  const box=$('modalNews');
  box.innerHTML='';
  state.todayNews.forEach(n=>{
    const co=COMPANIES.find(c=>c.id===n.companyId);
    const item=document.createElement('div');
    item.className='news-item';
    item.innerHTML=
      '<span class="news-arrow '+n.direction+'">'+(n.direction==='up'?'▲':'▼')+'</span>'+
      '<div><p class="news-co">'+co.name+'</p><p class="news-headline">'+n.headline+'</p></div>';
    box.appendChild(item);
  });
  $('modalOverlay').classList.add('show');
}

function closeModal(){
  state.pendingModal=false;
  state.dayStartTs=Date.now();
  state.lastTickTs=Date.now();
  $('modalOverlay').classList.remove('show');
  save();
  renderDynamic();
}

function buildMarket(){
  const body=$('marketBody');
  body.innerHTML='';
  COMPANIES.forEach(c=>{
    const row=document.createElement('div');
    row.className='row';
    row.innerHTML=
      '<span class="co-name">'+c.name+'</span>'+
      '<span class="co-price" id="price-'+c.id+'"></span>'+
      '<span class="co-change" id="change-'+c.id+'"></span>'+
      '<span class="co-hold" id="hold-'+c.id+'"></span>'+
      '<span class="trade">'+
        '<input type="number" id="qty-'+c.id+'" value="1" min="1" step="1">'+
        '<button class="btn-buy" onclick="buy(\''+c.id+'\')">매수</button>'+
        '<button class="btn-sell" onclick="sell(\''+c.id+'\')">매도</button>'+
      '</span>';
    body.appendChild(row);
  });
}

function renderDynamic(){
  $('dayLabel').textContent='Day '+state.day;
  if(state.pendingModal){
    $('dayTimer').textContent='뉴스 확인 대기중';
  }else{
    const remain=Math.max(0,DAY_LENGTH-(Date.now()-state.dayStartTs));
    const m=Math.floor(remain/60000), s=Math.floor((remain%60000)/1000);
    $('dayTimer').textContent=pad2(m)+':'+pad2(s);
  }

  let totalStock=0;
  COMPANIES.forEach(c=>{
    const price=state.prices[c.id];
    const open=state.dayOpenPrices[c.id]||price;
    const pct=((price-open)/open)*100;
    const hold=state.holdings[c.id]||0;
    totalStock+=price*hold;

    $('price-'+c.id).textContent=fmtWon(price);
    const changeEl=$('change-'+c.id);
    changeEl.textContent=fmtPct(pct);
    changeEl.className='co-change '+(pct>=0?'up':'down');
    $('hold-'+c.id).textContent=hold+'주';
  });

  const total=state.cash+totalStock;
  const returnPct=((total-INIT_CASH)/INIT_CASH)*100;
  $('statCash').textContent=fmtWon(state.cash);
  $('statTotal').textContent=fmtWon(total);
  const retEl=$('statReturn');
  retEl.textContent=fmtPct(returnPct);
  retEl.className='stat-value '+(returnPct>=0?'pos':'neg');
}

$('resetBtn').addEventListener('click',resetGame);
$('modalClose').addEventListener('click',closeModal);

buildMarket();
renderDynamic();
if(state.pendingModal) openModal();

setInterval(()=>{
  if(!state.pendingModal){
    checkDayChange();
    if(!state.pendingModal){
      const now=Date.now();
      if(now-state.lastTickTs>=TICK_LENGTH){
        tick();
        state.lastTickTs=now;
      }
    }
  }
  save();
  renderDynamic();
},1000);
</script>
</body>
</html>
